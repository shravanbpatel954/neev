services:
  - type: web
    name: neev
    runtime: node
    plan: free
    region: singapore
    buildCommand: echo "site is prebuilt in dist"
    startCommand: node server/gateway.js
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NEEV_SECRET
        generateValue: true
